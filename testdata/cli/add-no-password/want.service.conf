# pg_service.conf — 손으로 관리하던 파일
# 이 머리말은 첫 섹션과 빈 줄로 분리되어 있다.

;  세미콜론 주석도 보존한다

# desc: 운영 DB 읽기 전용 (정산)
# tags: prod, readonly, settlement
# 담당: 김OO / 점검: 매주 화요일
[prod-settle-ro]
host=db.example.com
port=5432
dbname=settledb
user=readonly
sslmode=require
options=-c timezone=Asia/Seoul

# 쓰기 계정 — 빈 줄로 분리된 그룹 주석

# desc: 운영 DB 쓰기
[prod-settle-rw]
  host = db.example.com   
port=5432
# 예전 포트: 6432
dbname=settledb
user=writer
	
[stg-settle]
host=stg.example.com
dbname=settledb
user=app


# tags: dev
[dev-local]
dbname=devdb
user=me

[plain]
dbname=plaindb
user=me
